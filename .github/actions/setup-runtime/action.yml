name: Centaur runtime
description: Build the centaur workflow scripts from this action's checkout and assume the AWS role through OIDC. Run it once per job, after checking out the consumer repository.
runs:
  using: composite
  steps:
    - name: Keep turn files out of git status
      shell: bash
      run: echo .centaur-turn >> .git/info/exclude
    - name: Read the Node version
      id: node
      shell: bash
      run: echo "version=$(cat "${{ github.action_path }}/../../../.nvmrc")" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.node.outputs.version }}
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - name: Build workflow scripts
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: yarn install --immutable && yarn build
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.CENTAUR_ROLE_ARN }}
        aws-region: ${{ env.CENTAUR_AWS_REGION }}
