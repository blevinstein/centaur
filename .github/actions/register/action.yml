name: Centaur register
description: Validate .centaur.yml and bind its bot to this repository. Needs the id-token write permission and the centaur setup-runtime step before it.
runs:
  using: composite
  steps:
    - name: Register the bot
      shell: bash
      env:
        CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
        CENTAUR_OIDC_AUDIENCE: ${{ vars.CENTAUR_OIDC_AUDIENCE }}
      run: node "${{ github.action_path }}/../../../dist/workflows/cli.js" register
