name: Centaur resolve schedule
description: Compute the bot's concurrency group for a scheduled turn job, so a scheduled run never overlaps any other turn of the bot. Run after checkout and the centaur setup-runtime step.
inputs:
  root:
    description: Directory, relative to the repository root, that holds the Centaur config and the files it references. Set it for a bot that lives in a sub-folder; the default is the repository root.
    default: "."
outputs:
  group:
    description: The bot's concurrency group, shared by all of its turn jobs. Never contains a chat or thread ID.
    value: ${{ steps.resolve.outputs.group }}
runs:
  using: composite
  steps:
    - name: Locate the Centaur CLI
      shell: bash
      run: echo "CENTAUR_CLI=$(cd "${{ github.action_path }}/../../.." && pwd)/dist/workflows/cli.js" >> "$GITHUB_ENV"

    - name: Resolve the concurrency group
      id: resolve
      shell: bash
      env:
        CENTAUR_ROOT: ${{ inputs.root }}
      run: node "$CENTAUR_CLI" resolve-schedule
