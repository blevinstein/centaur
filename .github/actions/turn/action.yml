name: Centaur agent turn
description: One agent turn. Answers the dispatched chat message, or with prompt_name starts a new thread from that prompt in the Centaur config, or with comment answers the comments on that pull request. Run after checkout and the centaur setup-runtime step.
inputs:
  comment:
    description: Number of a pull request to answer comments on (the resolve job's pull_request output), with its head branch checked out. Pushes to that branch instead of opening a pull request, and needs contents and pull-requests write plus id-token write.
    default: ""
  config_root:
    description: Directory to read the Centaur config, the instructions and the persona from, instead of the workspace. Set it to a checkout of the default branch for a pull request comment turn, so the pull request cannot change the agent's tools or persona.
    default: ""
  root:
    description: Directory, relative to the repository root, that holds the Centaur config and the files it references. Set it for a bot that lives in a sub-folder; the default is the repository root.
    default: "."
  prompt_name:
    description: Name of a prompt in the Centaur config; starts a new thread instead of answering a dispatched message.
    default: ""
  anthropic_api_key:
    description: Used when the bot's provider is anthropic.
    default: ""
  openrouter_api_key:
    description: Used when the bot's provider is openrouter.
    default: ""
outputs:
  skip:
    description: "'true' when there was nothing to do."
    value: ${{ steps.prepare.outputs.skip }}
  pull-request-url:
    description: URL of the pull request the agent opened, if any.
    value: ${{ steps.push_existing.outputs.pull-request-url || steps.pr.outputs.pull-request-url }}
runs:
  using: composite
  steps:
    - name: Locate the Centaur CLI
      shell: bash
      run: echo "CENTAUR_CLI=$(cd "${{ github.action_path }}/../../.." && pwd)/dist/workflows/cli.js" >> "$GITHUB_ENV"

    - name: Prepare turn
      id: prepare
      shell: bash
      env:
        PROMPT_NAME: ${{ inputs.prompt_name }}
        COMMENT_PULL_REQUEST: ${{ inputs.comment }}
        CENTAUR_CONFIG_ROOT: ${{ inputs.config_root }}
        CENTAUR_ROOT: ${{ inputs.root }}
        CENTAUR_SKILLS_DIR: ${{ github.action_path }}/../../../skills
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$CENTAUR_CLI" prepare

    - name: Route model API to a custom base URL
      if: steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.base_url != ''
      shell: bash
      env:
        BASE_URL: ${{ steps.prepare.outputs.base_url }}
      run: echo "ANTHROPIC_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

    - name: Run agent
      id: agent
      if: steps.prepare.outputs.skip != 'true'
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ steps.prepare.outputs.api_key_secret == 'OPENROUTER_API_KEY' && inputs.openrouter_api_key || inputs.anthropic_api_key }}
        github_token: ${{ github.token }}
        prompt: Read .centaur-turn/prompt.md and follow it.
        claude_args: ${{ steps.prepare.outputs.claude_args }}

    - name: Audit MCP tool calls
      if: steps.prepare.outputs.skip != 'true'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
      run: node "$CENTAUR_CLI" audit-tool-calls

    - name: Describe pull request
      id: pr_details
      if: steps.prepare.outputs.skip != 'true' && inputs.comment == ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$CENTAUR_CLI" pr-details

    - name: Plan pull request target
      id: plan
      if: steps.prepare.outputs.skip != 'true' && inputs.comment == ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        CENTAUR_CONFIG_ROOT: ${{ inputs.config_root }}
        CENTAUR_ROOT: ${{ inputs.root }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$CENTAUR_CLI" plan-pr

    - name: Update existing pull request
      id: push_existing
      continue-on-error: true
      if: steps.prepare.outputs.skip != 'true' && inputs.comment == '' && steps.plan.outputs.target == 'existing'
      shell: bash
      env:
        TARGET_HEAD_REF: ${{ steps.plan.outputs.head_ref }}
        TARGET_PR_NUMBER: ${{ steps.plan.outputs.number }}
        PR_TITLE: ${{ steps.pr_details.outputs.title }}
      run: node "$CENTAUR_CLI" push-existing

    - name: Push to the default branch
      id: push_direct
      continue-on-error: true
      if: steps.prepare.outputs.skip != 'true' && inputs.comment == '' && steps.plan.outputs.target == 'direct'
      shell: bash
      env:
        PR_TITLE: ${{ steps.pr_details.outputs.title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CENTAUR_CONFIG_ROOT: ${{ inputs.config_root }}
        CENTAUR_ROOT: ${{ inputs.root }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$CENTAUR_CLI" push-direct

    - name: Open pull request
      id: pr
      continue-on-error: true
      if: steps.prepare.outputs.skip != 'true' && inputs.comment == '' && (steps.plan.outputs.target == 'thread' || steps.push_existing.outputs.fallback == 'true' || steps.push_direct.outputs.fallback == 'true')
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ github.token }}
        branch: ${{ steps.prepare.outputs.branch }}
        commit-message: ${{ steps.pr_details.outputs.title }}
        title: ${{ steps.pr_details.outputs.title }}
        body: ${{ steps.pr_details.outputs.body }}

    - name: Post reply
      if: steps.prepare.outputs.skip != 'true'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        PULL_REQUEST_URL: ${{ steps.push_existing.outputs.pull-request-url || steps.pr.outputs.pull-request-url }}
        PULL_REQUEST_NUMBER: ${{ steps.push_existing.outputs.pull-request-number || steps.pr.outputs.pull-request-number }}
        PULL_REQUEST_UPDATED: ${{ steps.push_existing.outputs.pull-request-url != '' }}
        FALLBACK_REASON: ${{ steps.plan.outputs.fallback_reason || steps.push_existing.outputs.reason }}
        PULL_REQUEST_FAILED: ${{ steps.push_existing.outcome == 'failure' || steps.push_direct.outcome == 'failure' || steps.pr.outcome == 'failure' }}
        DIRECT_PUSH: ${{ steps.plan.outputs.target == 'direct' }}
        DIRECT_BRANCH: ${{ steps.push_direct.outputs.branch }}
        DIRECT_COMMIT_SHA: ${{ steps.push_direct.outputs.commit-sha }}
        DIRECT_FALLBACK_REASON: ${{ steps.push_direct.outputs.reason }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CENTAUR_CONFIG_ROOT: ${{ inputs.config_root }}
        CENTAUR_ROOT: ${{ inputs.root }}
        COMMENT_PULL_REQUEST: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$CENTAUR_CLI" finish
