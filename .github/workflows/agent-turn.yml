name: Centaur agent turn

on:
  workflow_call:
    inputs:
      prompt_name:
        description: Name of a prompt in .centaur.yml; starts a new thread instead of answering a dispatched message.
        type: string
        default: ""
      centaur_repository:
        description: Repository holding these workflows; defaults to the called workflow's repository.
        type: string
        default: ""
      centaur_ref:
        description: Ref of centaur_repository to build scripts from; defaults to the called workflow's commit.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: centaur-${{ github.event.client_payload.bot || github.repository }}-${{ github.event.client_payload.thread_id || github.run_id }}
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
      CENTAUR_SESSION_BUCKET: ${{ vars.CENTAUR_SESSION_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.centaur_repository || job.workflow_repository }}
          ref: ${{ inputs.centaur_ref || job.workflow_sha }}
          path: .centaur-runtime
          persist-credentials: false
      - uses: ./.centaur-runtime/.github/actions/setup-runtime
        with:
          role-arn: ${{ vars.CENTAUR_ROLE_ARN }}
          region: ${{ vars.CENTAUR_AWS_REGION }}

      - name: Prepare turn
        id: prepare
        env:
          PROMPT_NAME: ${{ inputs.prompt_name }}
        run: node .centaur-runtime/dist/workflows/cli.js prepare

      - name: Route model API to a custom base URL
        if: steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.base_url != ''
        env:
          BASE_URL: ${{ steps.prepare.outputs.base_url }}
        run: echo "ANTHROPIC_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Run agent
        id: agent
        if: steps.prepare.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets[steps.prepare.outputs.api_key_secret] }}
          github_token: ${{ github.token }}
          prompt: Read .centaur-turn/prompt.md and follow it.
          claude_args: ${{ steps.prepare.outputs.claude_args }}

      - name: Open pull request
        id: pr
        if: steps.prepare.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.prepare.outputs.branch }}
          commit-message: Centaur agent changes
          title: Centaur agent changes
          body: Opened by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Post reply
        if: steps.prepare.outputs.skip != 'true'
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          PULL_REQUEST_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: node .centaur-runtime/dist/workflows/cli.js finish

      - name: Report failure in the thread
        if: failure() && steps.prepare.outputs.thread_id != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .centaur-runtime/dist/workflows/cli.js notify-failure
