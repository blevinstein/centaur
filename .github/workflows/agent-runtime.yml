name: Agent runtime experiment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-session-role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: s3://${{ vars.SESSION_BUCKET }}/sessions/verify/probe.txt
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SESSION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write, read, and delete a session object
        run: |
          echo probe > "$RUNNER_TEMP/probe.txt"
          aws s3 cp --only-show-errors "$RUNNER_TEMP/probe.txt" "$KEY"
          aws s3 cp --only-show-errors "$KEY" "$RUNNER_TEMP/back.txt"
          cmp "$RUNNER_TEMP/probe.txt" "$RUNNER_TEMP/back.txt"
          aws s3 ls "${KEY%/*}/" > /dev/null
          echo "write/read/list ok"
          if aws s3 rm --only-show-errors "$KEY"; then echo "delete ok"; else echo "delete denied (role has no s3:DeleteObject)"; fi
