name: Centaur register

on:
  push:
    branches: [main]
    paths:
      - apps/centaur-test/.centaur.yml
      - apps/centaur-test/.centaur/**
      - apps/centaur-test-2/.centaur.yml
      - apps/centaur-test-2/.centaur/**
      - apps/centaur-dev/.centaur.yml
      - apps/centaur-dev/.centaur/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  register:
    strategy:
      fail-fast: false
      matrix:
        root: [apps/centaur-test, apps/centaur-test-2, apps/centaur-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CENTAUR_ROLE_ARN: ${{ vars.CENTAUR_ROLE_ARN }}
      CENTAUR_AWS_REGION: ${{ vars.CENTAUR_AWS_REGION }}
      CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
      CENTAUR_OIDC_AUDIENCE: ${{ vars.CENTAUR_OIDC_AUDIENCE }}
      CENTAUR_SESSION_BUCKET: ${{ vars.CENTAUR_SESSION_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/register
        with:
          root: ${{ matrix.root }}
