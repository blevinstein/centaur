name: Centaur hello

on:
  workflow_dispatch:
    inputs:
      prompt_name:
        description: Prompt in the Centaur config to run.
        default: hello

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CENTAUR_ROLE_ARN: ${{ vars.CENTAUR_ROLE_ARN }}
      CENTAUR_AWS_REGION: ${{ vars.CENTAUR_AWS_REGION }}
      CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
      CENTAUR_OIDC_AUDIENCE: ${{ vars.CENTAUR_OIDC_AUDIENCE }}
      CENTAUR_SESSION_BUCKET: ${{ vars.CENTAUR_SESSION_BUCKET }}
      GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/turn
        with:
          prompt_name: ${{ inputs.prompt_name }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure()
        uses: ./.github/actions/notify-failure
