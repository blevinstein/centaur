name: Centaur turn

on:
  workflow_call:
    inputs:
      bot:
        type: string
        required: true
      root:
        type: string
        required: true
      timeout_minutes:
        type: number
        default: 30

concurrency:
  group: centaur-${{ inputs.bot }}
  cancel-in-progress: false
  queue: max

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CENTAUR_ROLE_ARN: ${{ vars.CENTAUR_ROLE_ARN }}
      CENTAUR_AWS_REGION: ${{ vars.CENTAUR_AWS_REGION }}
      CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
      CENTAUR_OIDC_AUDIENCE: ${{ vars.CENTAUR_OIDC_AUDIENCE }}
      CENTAUR_SESSION_BUCKET: ${{ vars.CENTAUR_SESSION_BUCKET }}
      GITHUB_MCP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/turn
        with:
          root: ${{ inputs.root }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure()
        uses: ./.github/actions/notify-failure

  notify-timeout:
    needs: turn
    if: always() && needs.turn.result == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CENTAUR_ROLE_ARN: ${{ vars.CENTAUR_ROLE_ARN }}
      CENTAUR_AWS_REGION: ${{ vars.CENTAUR_AWS_REGION }}
      CENTAUR_FUNCTION_NAME: ${{ vars.CENTAUR_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-runtime
      - uses: ./.github/actions/notify-failure
