name: Centaur dev PR comment

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  comment:
    uses: ./.github/workflows/centaur-comment-turn.yml
    with:
      bot: centaur-dev
      root: apps/centaur-dev
      timeout_minutes: 90
    secrets: inherit
