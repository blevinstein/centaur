name: Centaur test 2 message

on:
  repository_dispatch:
    types: [centaur-message]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  turn:
    if: github.event.client_payload.bot == 'centaur-test-2'
    uses: ./.github/workflows/centaur-turn.yml
    with:
      bot: centaur-test-2
      root: apps/centaur-test-2
    secrets: inherit
