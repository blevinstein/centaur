name: Centaur

on:
  repository_dispatch:
    types: [centaur-message]
  push:
    branches: [main]
    paths: [.centaur.yml]
  workflow_dispatch:
    inputs:
      action:
        description: Register the bot, or start a thread from the hello prompt.
        type: choice
        options: [register, hello]
        default: hello

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  register:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'register')
    uses: ./.github/workflows/register.yml
    with:
      centaur_repository: ${{ github.repository }}
      centaur_ref: ${{ github.sha }}
  message:
    if: github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/agent-turn.yml
    with:
      centaur_repository: ${{ github.repository }}
      centaur_ref: ${{ github.sha }}
    secrets: inherit
  hello:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'hello'
    uses: ./.github/workflows/agent-turn.yml
    with:
      prompt_name: hello
      centaur_repository: ${{ github.repository }}
      centaur_ref: ${{ github.sha }}
    secrets: inherit
