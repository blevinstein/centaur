name: Centaur dev message

on:
  repository_dispatch:
    types: [centaur-message]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  turn:
    if: github.event.client_payload.bot == 'centaur-dev'
    uses: ./.github/workflows/centaur-turn.yml
    with:
      bot: centaur-dev
      root: apps/centaur-dev
      timeout_minutes: 90
    secrets: inherit
