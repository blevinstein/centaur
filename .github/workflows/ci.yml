name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out. Empty uses the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
      - run: yarn verify
      - run: yarn lint:cfn
