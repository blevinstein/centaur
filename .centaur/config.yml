bot: centaur-slack
platforms:
  slack:
    respond_to: all
  telegram:
    respond_to: all
context:
  default: transcript
provider: anthropic
model: sonnet
allowed_tools: "Read,Glob,Grep,Write,Edit,mcp__ghmcp__*"
persona: .centaur/persona.md
prompts:
  hello:
    destination: { slack: centaur-test-slack }
  pr-smoke:
    destination: { slack: centaur-test-slack }
  pr-update:
    destination: { slack: centaur-test-slack }
  mcp-smoke:
    destination: { slack: centaur-test-slack }
mcp_servers:
  ghmcp:
    url: https://api.githubcopilot.com/mcp/readonly
    headers:
      Authorization: { secret: GITHUB_MCP_TOKEN, prefix: "Bearer " }
      X-MCP-Readonly: "true"
