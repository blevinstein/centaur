AWSTemplateFormatVersion: '2010-09-09'
Description: Centaur session-file experiment - S3 session bucket and GitHub OIDC role.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or org allowed to assume the role.
  RepoName:
    Type: String
    Default: centaur
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN of an existing token.actions.githubusercontent.com provider. Empty creates one.
  ExpirationDays:
    Type: Number
    Default: 7

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  SessionBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-sessions
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: !Ref ExpirationDays

  SessionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # TODO: tighten to specific refs/environments.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${RepoName}:*
      Policies:
        - PolicyName: session-objects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${SessionBucket.Arn}/sessions/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SessionBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: sessions/*

Outputs:
  BucketName:
    Value: !Ref SessionBucket
  RoleArn:
    Value: !GetAtt SessionRole.Arn
