AWSTemplateFormatVersion: '2010-09-09'
Description: Centaur - receiver/poster Lambda with a function URL, S3 session bucket, DynamoDB state table, and a GitHub OIDC role scoped to one GitHub owner.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or org whose repositories may assume the role.
  GitHubOwnerId:
    Type: String
    AllowedPattern: '[0-9]+'
    Description: Numeric id of GitHubOwner (gh api users/<owner> --jq .id), used in immutable OIDC subjects.
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN of an existing token.actions.githubusercontent.com provider. Empty creates one.
  SessionExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days after which objects under sessions/ expire.
  AttachmentExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days after which objects under attachments/ expire.
  DeployLambda:
    Type: String
    Default: 'TRUE'
    AllowedValues: ['TRUE', 'FALSE']
    Description: FALSE creates everything except the Lambda and its dependents, so the code bucket exists before the first upload.
  CodeKey:
    Type: String
    Default: ''
    Description: S3 key of the Lambda zip in the code bucket. Required when DeployLambda is TRUE.
  CodeExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days after which uploaded Lambda zips expire.
  OidcAudience:
    Type: String
    Default: centaur
    Description: Audience that workflows request for the OIDC token they pass to the register operation.
  RequirePosterToken:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: When 'true', every poster operation must carry a GitHub OIDC token, and post, unreact, start-thread and get-mcp-policy are checked like the others. Set it after every repo runs a workflow version that sends the token.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: Days to keep Lambda logs.
  HistoryMaxMessages:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 5000
    Description: Newest messages kept per chat and per thread in stored history (Telegram). The state adapter reads the whole list on every append, so cost per message grows with this.
  HistoryTtlDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Days a stored history list lives after its latest message.
  DispatchFailureNoticeMinutes:
    Type: Number
    Default: 15
    MinValue: 0
    MaxValue: 1440
    Description: Minimum minutes between direct messages to a bot's admin about a failed GitHub dispatch, per bot. 0 turns the notice off.
  InspectionRolePrincipalArn:
    Type: String
    Default: ''
    Description: IAM user or role ARN allowed to assume the read-only inspection role. Empty trusts this account, so any identity in it that is itself allowed sts:AssumeRole can.

Conditions:
  ShouldDeployLambda: !Equals [!Ref DeployLambda, 'TRUE']
  TrustAccountForInspection: !Equals [!Ref InspectionRolePrincipalArn, '']
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  SessionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-sessions
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: !Ref SessionExpirationDays
          - Id: expire-attachments
            Status: Enabled
            Prefix: attachments/
            ExpirationInDays: !Ref AttachmentExpirationDays

  CodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-lambda-zips
            Status: Enabled
            ExpirationInDays: !Ref CodeExpirationDays

  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  StateTableAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets a role use the DynamoDB StateAdapter table. Attach it to the Lambda execution role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource: !GetAtt StateTable.Arn

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Upper bound for every role in the stack (permissions boundary) and the whole permission set of the deploy role. Creating or editing roles is only allowed when the role carries this boundary.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:ListBucket
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
            Resource:
              - !GetAtt SessionBucket.Arn
              - !GetAtt CodeBucket.Arn
              - !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-sessionbucket-*
              - !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-codebucket-*
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource:
              - !Sub ${SessionBucket.Arn}/sessions/*
              - !Sub ${SessionBucket.Arn}/attachments/*
              - !Sub ${CodeBucket.Arn}/centaur/*
          - Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt StateTable.Arn
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-StateTable-*
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-receiver
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-receiver:*
          - Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionCodeSigningConfig
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:GetPolicy
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:GetFunctionUrlConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-receiver
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/*
          - Effect: Allow
            Action: ssm:DescribeParameters
            Resource: '*'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*
            Condition:
              StringLike:
                iam:PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-DeployPolicy-*
          - Effect: Allow
            Action: iam:AttachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*
            Condition:
              StringLike:
                iam:PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-DeployPolicy-*
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-*
          - Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:DeleteRole
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-*
          - Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - !If
            - CreateProvider
            - Effect: Allow
              Action:
                - iam:CreateOpenIDConnectProvider
                - iam:GetOpenIDConnectProvider
                - iam:TagOpenIDConnectProvider
                - iam:UntagOpenIDConnectProvider
                - iam:AddClientIDToOpenIDConnectProvider
                - iam:RemoveClientIDFromOpenIDConnectProvider
                - iam:UpdateOpenIDConnectProviderThumbprint
              Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            - !Ref AWS::NoValue
          # The workflow cannot loosen its own role's trust, permissions or boundary; such changes need an admin deploy.
          - Effect: Deny
            Action:
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-DeployRole-*
          - Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-DeployPolicy-*

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldDeployLambda
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-receiver
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployLambda
    Properties:
      PermissionsBoundary: !Ref DeployPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - !Ref StateTableAccessPolicy
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${FunctionLogGroup.Arn}:*
        - PolicyName: attachments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${SessionBucket.Arn}/attachments/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SessionBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: attachments/*
        - PolicyName: parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/chats
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/chats/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/github/token
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/function-url
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/repo
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/mcp-approvals/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/chats/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/admin/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/admin-claim/*
              - Effect: Allow
                Action: ssm:PutParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/repo
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/approved-chats/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/approved-users/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/blocked/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/mcp-approvals/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/chats/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/admin/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/platforms/*/approvers/*
              - Effect: Allow
                Action: ssm:DeleteParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/admin-claim/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*/platforms/*/approvers/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  ReceiverFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldDeployLambda
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-receiver
      Runtime: nodejs24.x
      Handler: index.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt FunctionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          STATE_TABLE_NAME: !Ref StateTable
          SESSION_BUCKET_NAME: !Ref SessionBucket
          GITHUB_OWNER: !Ref GitHubOwner
          OIDC_AUDIENCE: !Ref OidcAudience
          REQUIRE_POSTER_TOKEN: !Ref RequirePosterToken
          HISTORY_MAX_MESSAGES: !Ref HistoryMaxMessages
          HISTORY_TTL_DAYS: !Ref HistoryTtlDays
          DISPATCH_FAILURE_NOTICE_MINUTES: !Ref DispatchFailureNoticeMinutes

  ReceiverFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: ShouldDeployLambda
    Properties:
      TargetFunctionArn: !Ref ReceiverFunction
      AuthType: NONE

  ReceiverFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployLambda
    Properties:
      FunctionName: !Ref ReceiverFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ReceiverFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployLambda
    Properties:
      FunctionName: !Ref ReceiverFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  FunctionUrlParameter:
    Type: AWS::SSM::Parameter
    Condition: ShouldDeployLambda
    Properties:
      Name: /centaur/function-url
      Type: String
      Value: !GetAtt ReceiverFunctionUrl.FunctionUrl

  StateTableParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /centaur/state-table
      Type: String
      Value: !Ref StateTable

  GitHubRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Ref DeployPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/*
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/*
      Policies:
        - PolicyName: session-objects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${SessionBucket.Arn}/sessions/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${SessionBucket.Arn}/attachments/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SessionBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: sessions/*
              - !If
                - ShouldDeployLambda
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt ReceiverFunction.Arn
                - !Ref AWS::NoValue

  InspectionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Ref DeployPolicy
      Description: Read-only access to the state table and bot parameters, for inspection.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !If
                - TrustAccountForInspection
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
                - !Ref InspectionRolePrincipalArn
      Policies:
        - PolicyName: inspect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/centaur/bots/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by the production deploy workflow to update this stack. Its permissions are DeployPolicy.
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref DeployPolicy
      ManagedPolicyArns:
        - !Ref DeployPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/centaur:environment:production
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/centaur:environment:production

Outputs:
  CodeBucketName:
    Value: !Ref CodeBucket
  BucketName:
    Value: !Ref SessionBucket
  RoleArn:
    Value: !GetAtt GitHubRole.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  InspectionRoleArn:
    Value: !GetAtt InspectionRole.Arn
  StateTableName:
    Value: !Ref StateTable
  StateTableArn:
    Value: !GetAtt StateTable.Arn
  StateTableAccessPolicyArn:
    Value: !Ref StateTableAccessPolicy
  FunctionName:
    Condition: ShouldDeployLambda
    Value: !Ref ReceiverFunction
  FunctionArn:
    Condition: ShouldDeployLambda
    Value: !GetAtt ReceiverFunction.Arn
  FunctionUrl:
    Condition: ShouldDeployLambda
    Value: !GetAtt ReceiverFunctionUrl.FunctionUrl
