bot: centaur-test
platform: telegram
respond_to: all
context:
  default: transcript
provider: anthropic
model: sonnet
allowed_tools: "Read,Glob,Grep,Write,Edit,mcp__ghmcp__*"
persona: .centaur/persona.md
prompts:
  hello:
    destination: centaur-test
  pr-smoke:
    destination: centaur-test
  pr-update:
    destination: centaur-test
  mcp-smoke:
    destination: centaur-test
mcp_servers:
  ghmcp:
    url: https://api.githubcopilot.com/mcp/readonly
    headers:
      Authorization: { secret: GITHUB_MCP_TOKEN, prefix: "Bearer " }
      X-MCP-Readonly: "true"
