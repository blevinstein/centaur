bot: centaur-slack
platforms:
  slack:
    respond_to: all
    bot_messages: mention
  telegram:
    respond_to: all
context:
  default: transcript
chat_tools:
  scope: chat
provider: anthropic
model: sonnet
allowed_tools: "Read,Glob,Grep,Write,Edit,mcp__ghmcp__*"
persona: .centaur/persona.md
prompts:
  hello:
    destination: { slack: centaur-test-slack, telegram: centaur-test }
  hello-telegram:
    file: .centaur/prompts/hello.md
    thread: persistent
    destination: { telegram: centaur-test }
  pr-smoke:
    destination: { slack: centaur-test-slack }
  pr-update:
    destination: { slack: centaur-test-slack }
  mcp-smoke:
    destination: { slack: centaur-test-slack, telegram: centaur-test }
mcp_servers:
  ghmcp:
    url: https://api.githubcopilot.com/mcp/readonly
    headers:
      Authorization: { secret: GITHUB_MCP_TOKEN, prefix: "Bearer " }
      X-MCP-Readonly: "true"
