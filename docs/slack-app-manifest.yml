# Slack app manifest for one Centaur bot (one Slack app per bot/repo).
# Replace {{BOT_NAME}} with the bot name used in `centaur bot add` (lowercase letters, digits,
# `-` and `_`) and {{FUNCTION_URL}} with the receiver's Function URL, without a trailing slash.
# Steps: docs/onboarding.md#slack-personal-projects
display_information:
  name: "{{BOT_NAME}}"
  description: Centaur agent for the {{BOT_NAME}} repo

features:
  bot_user:
    display_name: "{{BOT_NAME}}"
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    request_url: "{{FUNCTION_URL}}/slack/{{BOT_NAME}}"
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
